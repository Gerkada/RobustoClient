name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore RobustoClient.sln

    - name: Build Mod (Release)
      run: dotnet build RobustoClient/RobustoClient.csproj -c Release --no-restore

    - name: Run Tests
      run: dotnet test RobustoClient.Tests/RobustoClient.Tests.csproj -c Release --no-restore
